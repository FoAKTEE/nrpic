# Retrieval test of stages K4-K5: ten questions with known answer locations, taken from the
# answers to the first questions of KB-G1 (tracks/kb/stage/KB-G1/FIRST_QUESTIONS.md, item in
# `from`). Questions are our own wording, written before any retrieval result was seen.
# A hit: a returned chunk of `paper` whose source range (file and lines of the stored source,
# through build/tex/<id>/sourcemap.json) overlaps one of `lines` in `file`.
# Line numbers are those of FIRST_QUESTIONS.md (kb-data/raw/arxiv/<id>/<version>/src/<file>).
version: 1
